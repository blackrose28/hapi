stages:
  - build
  - deploy

default:
  tags:
    - shell-ai-gitlab-runner-82-33

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "feat/shared-hub-shipping"'
    - when: never

.remote_defaults: &remote_defaults
  before_script:
    - |
      : "${DEPLOY_HOST:?Set DEPLOY_HOST in GitLab CI/CD variables}"
      : "${DEPLOY_USER:?Set DEPLOY_USER in GitLab CI/CD variables}"
      : "${DEPLOY_PATH:?Set DEPLOY_PATH in GitLab CI/CD variables}"
      : "${GITLAB_ACCESS_TOKEN:?Set GITLAB_ACCESS_TOKEN in GitLab CI/CD variables}"
      : "${GITLAB_TOKEN_USER:?Set GITLAB_TOKEN_USER in GitLab CI/CD variables}"
      export DEPLOY_PORT="${DEPLOY_PORT:-22}"
      export GITLAB_TOKEN_USER GITLAB_ACCESS_TOKEN
    - mkdir -p ~/.ssh
    - |
      if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
      fi

build_single_exe:
  stage: build
  extends: .remote_defaults
  resource_group: shared-hub-shipping-production
  script:
    - |
      ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
        "DEPLOY_PATH='$DEPLOY_PATH' CI_SERVER_HOST='$CI_SERVER_HOST' CI_PROJECT_PATH='$CI_PROJECT_PATH' CI_COMMIT_REF_NAME='$CI_COMMIT_REF_NAME' GITLAB_TOKEN_USER='$GITLAB_TOKEN_USER' GITLAB_ACCESS_TOKEN='$GITLAB_ACCESS_TOKEN' BUN_BIN='${BUN_BIN:-}' bash -s" <<'REMOTE'
      set -euo pipefail
      cd "$DEPLOY_PATH"

      export BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
      export PATH="$BUN_INSTALL/bin:$PATH"
      BUN_BIN="${BUN_BIN:-$(command -v bun || true)}"
      if [ -z "$BUN_BIN" ]; then
        echo "Bun was not found. Install it for $USER, or set the BUN_BIN CI/CD variable."
        exit 1
      fi

      auth_remote="https://${GITLAB_TOKEN_USER}:${GITLAB_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git fetch "$auth_remote" "$CI_COMMIT_REF_NAME"
      git checkout "$CI_COMMIT_REF_NAME"
      git merge --ff-only FETCH_HEAD

      "$BUN_BIN" install --frozen-lockfile
      "$BUN_BIN" run build:single-exe
      REMOTE

deploy_pm2:
  stage: deploy
  extends: .remote_defaults
  resource_group: shared-hub-shipping-production
  needs:
    - build_single_exe
  script:
    - |
      ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
        "DEPLOY_PATH='$DEPLOY_PATH' BUN_BIN='${BUN_BIN:-}' bash -s" <<'REMOTE'
      set -euo pipefail
      cd "$DEPLOY_PATH"
      export BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
      export PATH="$BUN_INSTALL/bin:$PATH"
      if [ -n "${BUN_BIN:-}" ]; then
        export PATH="$(dirname "$BUN_BIN"):$PATH"
      fi
      if ! command -v bun >/dev/null 2>&1; then
        echo "Bun was not found. Install it for $USER, or set PATH in that user's shell profile."
        exit 1
      fi
      pm2 stop all
      pm2 start all
      REMOTE