services:
    keycloak:
        image: quay.io/keycloak/keycloak:26.7.0
        container_name: hapi-local-keycloak
        command: start-dev --import-realm
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            KC_HOSTNAME: https://chuonglvubuntu.local:8443
            KC_HTTP_ENABLED: "true"
            KC_PROXY_HEADERS: xforwarded
        ports:
            - "127.0.0.1:18080:8080"
        volumes:
            - ./dev/keycloak/hapi-local-realm.json:/opt/keycloak/data/import/hapi-local-realm.json:ro
            - hapi-local-keycloak-data:/opt/keycloak/data
        restart: unless-stopped

volumes:
    hapi-local-keycloak-data:
